<!doctype html>
<html lang="ko">
<head>
<script src="/static/auth.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>YouTube 업로드 · Shortform</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/studio.css">
  <script src="/static/sns.js" defer></script>
</head>
<body class="studio">
<header class="studio-header"><a href="/" class="brand"><b aria-hidden="true">▶</b> Shortform</a><a id="sns-back" class="studio-back" href="/#projects">← 프로젝트 목록</a></header>
<main class="studio-main sns-page">
  <section class="studio-section-heading">
    <div><h1>YouTube에 게시</h1><p>영상과 채널, 제목, 공개 범위를 확인하세요. 기본은 비공개입니다.</p></div>
  </section>
  <section class="studio-panel">
    <p id="notice" role="status">설정을 확인하고 있어요.</p>
    <div id="chosen-output" hidden>
      <h2>선택한 완성 영상</h2>
      <p id="chosen-output-title"></p>
      <video id="chosen-output-preview" controls playsinline preload="metadata" aria-label="게시할 영상"></video>
      <p id="chosen-output-state" role="status"></p>
    </div>
    <button id="reload" class="secondary" hidden>상태 다시 조회</button>
    <section id="account-panel" hidden>
      <h2>업로드 계정</h2>
      <button id="connect" type="button">YouTube 계정 연결</button>
      <p class="hint">Google 동의 화면에서 업로드할 채널을 선택하세요.</p>
      <label for="account">연결된 YouTube 채널</label><select id="account"></select>
      <button id="disconnect" type="button" class="secondary">선택한 계정 연결 해제</button>
      <p class="hint">연결 해제는 이후 업로드를 차단합니다. 이미 전송 중인 작업은 취소되지 않습니다.</p>
    </section>
    <form id="upload-form" hidden>
      <h2>영상과 업로드 설정</h2>
      <div id="job-field"><label for="job">완성한 영상 작업 번호</label><input id="job" required autocomplete="off"></div>
      <label for="title">YouTube 제목</label><input id="title" required maxlength="100">
      <label for="privacy">공개 범위</label>
      <select id="privacy"><option value="private" selected>비공개</option><option value="unlisted">일부 공개</option><option value="public">공개</option></select>
      <label for="kids">아동용 콘텐츠인가요?</label>
      <select id="kids" required><option value="">직접 선택하세요</option><option value="false">아니요</option><option value="true">예</option></select>
      <button id="prepare" type="submit">업로드 내용 미리 확인</button>
    </form>
    <section id="review-panel" hidden>
      <h2 id="upload-heading">최종 업로드 확인</h2>
      <dl class="upload-details"><dt>채널</dt><dd id="review-channel"></dd><dt>제목</dt><dd id="review-title"></dd><dt>공개 범위</dt><dd id="review-privacy"></dd><dt>아동용</dt><dd id="review-kids"></dd><dt>출력 버전 (SHA-256)</dt><dd id="review-version"></dd></dl>
      <video id="sns-preview" controls preload="metadata"></video>
      <p id="upload-state" role="status"></p>
      <div id="confirmation">
        <label class="confirm-label"><input type="checkbox" id="approved">위 채널·영상·제목·공개 범위를 확인했고 업로드에 동의합니다.</label>
        <button id="confirm" disabled>확인한 내용으로 YouTube에 업로드</button>
        <button id="edit" class="secondary">설정 다시 작성</button>
      </div>
      <button id="probe" class="secondary" hidden>재전송 없이 YouTube 상태 확인</button>
      <a id="remote" class="new-job" rel="noopener noreferrer" target="_blank" hidden>YouTube에서 영상 확인</a>
      <a href="/sns" class="new-job">다른 영상 업로드하기</a>
    </section>
  </section>
</main>
<footer class="studio-footer"><a href="/#projects">내 프로젝트</a></footer>
</body></html>
